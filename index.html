<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Lars Heine" />
    <meta name="color-scheme" content="light dark"/>

    <title>Digitaal tuintje van Lars Heine</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />

    <script
      data-page="https://larsss.nl"
      src="https://digitaaltuintje.nl/webring.js"
    ></script>
  </head>

  <body>
   <div class="cookiebanner">
      <p>Deze site maakt gebruik van koekjes,
        <a href="https://docs.github.com/en/site-policy/privacy-policies/github-cookies" class="cookieinfo">voor meer info over de github cookies klik hier!</a>
      </p>
      <button class="accept">Accepteren</button>
      <button class="decline">Weigeren</button>
   </div>

    <header>
      <h1>Klik om door te gaan!</h1>
    </header>

    <main>
      <a href="menu.html">
        <picture>
          <source media="(min-width: 800px)" srcset="./assets/PicturesOfSVG/AJAX_BACKGROUND1.svg"/>
          <img src="./assets/PicturesOfSVG/AJAX_BACKGROUND.svg" alt="Ajax afbeelding, klik om verder te gaan"/>
        </picture>
      </a>
    </main>

    <footer>
      <button class="cookiesettings">Cookie-instellingen</button>
    </footer>

    <script>
      document.querySelector('.accept').onclick = () => {
        document.querySelector('.cookiebanner').classList.add('closed');
      };
      document.querySelector('.decline').onclick = () => {
        window.location.href = 'https://www.youtube.com/watch?v=K_32IZ2Xtjk';
      };
      document.querySelector('.cookiesettings').onclick = () => {
        document.querySelector('.cookiebanner').classList.remove('closed');
      };
    </script>

  </body>
</html>
